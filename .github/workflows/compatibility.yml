name: OpenWrt main compatibility

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout package metadata
        uses: actions/checkout@v7
        with:
          filter: tree:0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /compat/
            /scripts/
            /**/Makefile
            /**/Config.in

      - name: Install static-check prerequisites
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Check static compatibility debt
        run: ./scripts/compat/static-check.sh "$RUNNER_TEMP/static-report.md"

      - name: Upload static report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-compatibility-report
          path: ${{ runner.temp }}/static-report.md

  metadata:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout package metadata
        uses: actions/checkout@v7
        with:
          filter: tree:0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /compat/
            /scripts/
            /**/Makefile
            /**/Config.in

      - name: Install OpenWrt prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3-setuptools ripgrep rsync \
            swig unzip zlib1g-dev file wget

      - name: Prepare latest OpenWrt main
        run: |
          git clone --depth=1 --filter=blob:none \
            https://github.com/openwrt/openwrt.git "$RUNNER_TEMP/openwrt"
          cd "$RUNNER_TEMP/openwrt"
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          printf '%s\n' "src-link op_packages $GITHUB_WORKSPACE" >> feeds.conf
          ./scripts/feeds update op_packages
          ./scripts/feeds install -a -p op_packages

      - name: Validate feed and Kconfig metadata
        env:
          COMPAT_LOG_DIR: ${{ runner.temp }}/compatibility-logs
        run: >-
          ./scripts/compat/check-openwrt.sh
          "$RUNNER_TEMP/openwrt"
          op_packages
          "$RUNNER_TEMP/openwrt-main-report.md"

      - name: Upload OpenWrt report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-main-compatibility-report
          path: |
            ${{ runner.temp }}/openwrt-main-report.md
            ${{ runner.temp }}/compatibility-logs/
